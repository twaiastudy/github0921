<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Daily Focus</p>
        <h1 id="app-title">待辦清單</h1>
        <p class="subtitle">把今天要處理的事情整理乾淨，逐一完成。</p>
      </header>

      <form id="todo-form" class="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">輸入待辦事項</label>
        <input
          id="todo-input"
          class="todo-input"
          type="text"
          maxlength="120"
          placeholder="輸入待辦事項..."
        >
        <button class="add-button" type="submit">新增</button>
      </form>

      <div class="filter-group" role="group" aria-label="篩選待辦事項">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>

      <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="todo-footer">
        <span id="remaining-count">未完成:0 項</span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
